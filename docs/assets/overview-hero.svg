<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Road Anomaly Detection Overview</title>
  <desc id="desc">Overview banner for a YOLO-based road anomaly detection repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" rx="32" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="110" fill="#1d4ed8" opacity="0.18"/>
  <circle cx="930" cy="520" r="160" fill="#22c55e" opacity="0.12"/>
  <rect x="64" y="80" width="492" height="480" rx="28" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="96" y="150" fill="#e2e8f0" font-size="28" font-family="Segoe UI, Arial, sans-serif">Road Anomaly Detection</text>
  <text x="96" y="195" fill="#94a3b8" font-size="18" font-family="Segoe UI, Arial, sans-serif">YOLO-powered inspection for images, videos, and dash-cam streams</text>
  <rect x="96" y="235" width="200" height="42" rx="21" fill="#0f172a" stroke="#22c55e"/>
  <text x="126" y="262" fill="#dcfce7" font-size="17" font-family="Segoe UI, Arial, sans-serif">Streamlit App</text>
  <rect x="312" y="235" width="190" height="42" rx="21" fill="#0f172a" stroke="#38bdf8"/>
  <text x="352" y="262" fill="#dbeafe" font-size="17" font-family="Segoe UI, Arial, sans-serif">2 YOLO Models</text>
  <text x="96" y="330" fill="#f8fafc" font-size="22" font-family="Segoe UI, Arial, sans-serif">Core classes</text>
  <text x="96" y="370" fill="#cbd5e1" font-size="18" font-family="Segoe UI, Arial, sans-serif">Crack  Crack-Severe  Pothole  Speed-Bump</text>
  <text x="96" y="410" fill="#cbd5e1" font-size="18" font-family="Segoe UI, Arial, sans-serif">Heavy-Vehicle  Light-Vehicle  Pedestrian</text>
  <rect x="96" y="455" width="376" height="12" rx="6" fill="#1e293b"/>
  <rect x="96" y="455" width="280" height="12" rx="6" fill="url(#accent)"/>
  <text x="96" y="500" fill="#f8fafc" font-size="18" font-family="Segoe UI, Arial, sans-serif">Production-ready repository structure with docs, models, scripts, and archived outputs</text>
  <rect x="620" y="96" width="516" height="448" rx="28" fill="#f8fafc"/>
  <rect x="650" y="136" width="456" height="272" rx="22" fill="#dbeafe" stroke="#93c5fd" stroke-width="3"/>
  <rect x="704" y="184" width="88" height="120" rx="10" fill="#94a3b8"/>
  <rect x="812" y="162" width="150" height="52" rx="14" fill="#0f172a"/>
  <text x="840" y="194" fill="#f8fafc" font-size="18" font-family="Segoe UI, Arial, sans-serif">Camera Feed</text>
  <rect x="840" y="250" width="126" height="96" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  <text x="860" y="305" fill="#166534" font-size="18" font-family="Segoe UI, Arial, sans-serif">Pothole</text>
  <rect x="998" y="214" width="70" height="126" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="1008" y="286" fill="#92400e" font-size="16" font-family="Segoe UI, Arial, sans-serif">Crack</text>
  <text x="660" y="456" fill="#0f172a" font-size="22" font-family="Segoe UI, Arial, sans-serif">Upload media, run inference, review detections, download outputs.</text>
  <text x="660" y="494" fill="#475569" font-size="18" font-family="Segoe UI, Arial, sans-serif">Designed for reproducible local use with requirements-based installation.</text>
</svg>
