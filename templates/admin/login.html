{% extends "app_base.html" %}
{% block title %}Administrator sign-in · Safe Street{% endblock %}
{% block content %}
<div class="auth-wrap auth-inline">
  <div class="card auth-card">
    <div class="kicker">SAFE STREET ADMIN</div>
    <h1>Administrator sign-in</h1>
    <p class="muted">This page is for authorized administrators only. Community members should use the regular sign-in.</p>
    <form method="post" action="{{ url_for('admin_login_post') }}">
      <input type="hidden" name="next" value="{{ next or '' }}">
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required value="{{ email or '' }}">
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign in as administrator</button>
    </form>
    <p class="hint" style="margin-top:1rem;"><a href="{{ url_for('login') }}">Community sign-in</a></p>
  </div>
</div>
{% endblock %}
