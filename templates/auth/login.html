{% extends "app_base.html" %}
{% block title %}Login · Safe Street{% endblock %}
{% block content %}
<div class="auth-wrap auth-inline">
  <div class="card auth-card">
    <div class="kicker">SAFE STREET</div>
    <h1>Sign in</h1>
    <p class="muted">Sign in to report road damage. Browsing reports does not require an account.</p>
    <form method="post" action="{{ url_for('login_post') }}">
      <input type="hidden" name="next" value="{{ next or '' }}">
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required value="{{ email or '' }}">
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
      </div>
      <div class="form-field" style="display:flex;align-items:center;gap:.5rem;">
        <input id="remember" name="remember" type="checkbox">
        <label for="remember" style="margin:0;">Remember me</label>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <p class="hint" style="margin-top:1rem;">
      <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
      ·
      <a href="{{ url_for('register', next=next) }}">Create account</a>
      ·
      <a href="{{ url_for('admin_login') }}">Admin Login</a>
    </p>
  </div>
</div>
{% endblock %}
